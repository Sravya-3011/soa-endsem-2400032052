
services:
  postgres:
    image: postgres:16-alpine
    container_name: yoga-postgres-container
    environment:
      POSTGRES_DB: yogaSessiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sravya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yogaSessiondb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yoga-backend-container
    ports:
      - "8002:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
